name: keep-swarm-studio-alive

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (~1,440 min/month, inside the 2,000 free private-repo minutes)
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python restart_studio.py
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
          LIGHTNING_ORG: ${{ secrets.LIGHTNING_ORG }}
          LIGHTNING_USER: ${{ secrets.LIGHTNING_USER }}
